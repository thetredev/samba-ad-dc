services:
  dc1:
    image: samba:debian
    restart: unless-stopped
    network_mode: host
    container_name: dc1
    hostname: dc1
    privileged: true
    environment:
      REALM: thetre.dev
      DOMAIN: THETRE
      ADMIN_PASS: Passw0rd
      DNS_BACKEND: BIND9_DLZ
      DNS_FORWARDER: 9.9.9.9
    volumes:
      - dc1:/usr/local/samba

volumes:
  dc1:
